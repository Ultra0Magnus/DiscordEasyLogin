name: Release

# Push a tag named after the version in pom.xml (e.g. v0.0.2) and this builds the jar, runs the
# unit tests, and publishes a GitHub Release with the jar and its SHA-256 attached.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check the tag matches pom.xml
        run: |
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pom.xml version ${VERSION}"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - run: mvn -B verify

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR="target/DiscordEasyLogin-${VERSION}.jar"
          SHA=$(sha256sum "$JAR" | cut -d' ' -f1)
          cat > notes.md <<EOF
          DiscordEasyLogin ${VERSION} for Paper 26.1.2 and 26.2 (Java 25).

          Drop \`DiscordEasyLogin-${VERSION}.jar\` into \`plugins/\` and see the README for setup.

          SHA-256: \`${SHA}\`
          EOF
          gh release create "${GITHUB_REF_NAME}" "$JAR" \
            --title "DiscordEasyLogin ${VERSION}" \
            --notes-file notes.md \
            --verify-tag
