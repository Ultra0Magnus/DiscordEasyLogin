name: DiscordEasyLogin
version: '${project.version}'
main: io.github.ultra0magnus.discordeasylogin.DiscordEasyLoginPlugin
api-version: '26.1'
description: Requires a single-use code posted to Discord before a player may play.
author: Ultra0Magnus
website: https://github.com/Ultra0Magnus/DiscordEasyLogin
load: POSTWORLD
permissions:
  discordeasylogin.admin:
    description: Use /discordeasylogin administration commands.
    default: op
  discordeasylogin.bypass:
    description: Skip Discord verification entirely. Grant with care - it defeats the gate.
    default: false
